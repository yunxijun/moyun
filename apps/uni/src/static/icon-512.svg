<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fdfbf6"/>
      <stop offset="100%" stop-color="#ebe3d3"/>
    </radialGradient>
    <linearGradient id="brush5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6b3e"/>
      <stop offset="50%" stop-color="#c4a35a"/>
      <stop offset="100%" stop-color="#6b4c30"/>
    </linearGradient>
    <linearGradient id="tip5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
    <filter id="shd5">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a1a2e" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg5)"/>
  <!-- Ink splash -->
  <ellipse cx="290" cy="400" rx="100" ry="22" fill="#1a1a2e" opacity="0.05"/>
  <circle cx="180" cy="380" r="40" fill="#1a1a2e" opacity="0.035"/>
  <circle cx="350" cy="365" r="22" fill="#5b7f95" opacity="0.04"/>
  <!-- Brush group -->
  <g filter="url(#shd5)">
    <!-- Handle -->
    <rect x="228" y="36" width="56" height="220" rx="14" fill="url(#brush5)" stroke="#a0813c" stroke-width="2"/>
    <!-- Bands -->
    <rect x="228" y="90" width="56" height="6" rx="2" fill="#a0813c" opacity="0.6"/>
    <rect x="228" y="150" width="56" height="6" rx="2" fill="#a0813c" opacity="0.6"/>
    <!-- Ferrule -->
    <rect x="220" y="252" width="72" height="26" rx="7" fill="#6b4c30"/>
    <!-- Tip -->
    <path d="M222 278 Q236 380, 256 440 Q276 380, 290 278 Z" fill="url(#tip5)" opacity="0.9"/>
    <!-- Ink drop -->
    <ellipse cx="256" cy="446" rx="14" ry="10" fill="#1a1a2e" opacity="0.7"/>
  </g>
  <!-- Ink stroke -->
  <path d="M120 355 Q170 320, 256 340 Q342 360, 400 330" stroke="#1a1a2e" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.1"/>
  <!-- Red seal -->
  <g>
    <rect x="345" y="375" width="80" height="80" rx="8" fill="#c73e1d" opacity="0.8"/>
    <line x1="362" y1="396" x2="408" y2="396" stroke="#faf8f3" stroke-width="3" stroke-linecap="round"/>
    <line x1="362" y1="414" x2="408" y2="414" stroke="#faf8f3" stroke-width="3" stroke-linecap="round"/>
    <line x1="362" y1="432" x2="394" y2="432" stroke="#faf8f3" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
