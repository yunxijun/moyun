[build]
  command = "pnpm install && pnpm build:h5"
  publish = "apps/uni/dist/build/h5"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["server/src/**", "packages/core/src/**"]

# API 路由 → Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA 路由：其余路径回退到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源长缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
