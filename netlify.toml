[build]
  command = "pnpm install && node scripts/build-functions.mjs && pnpm build:h5"
  publish = "apps/uni/dist/build/h5"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions-serve"

# SPA 路由：非 API 路径回退到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源长缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
